        <div class="contact-form">

            <div class="form-group">

                <label>Adresse email</label>

            </div>

            <div class="form-group">
                <label>Sujet</label>
                <input type="text" placeholder="Sujet de votre message">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Écrivez votre message ici..."></textarea>
            </div>

            <button class="btn-envoyer">Envoyer le message</button>

        </div>
